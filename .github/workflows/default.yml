name: Python CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9
    services:
      postgres:
        image: postgres
        ports:
          - 5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v7
    - name: Install Dependencies
      run: |
        pip install -e .
    - name: Run Tests
      env:
        DJANGO_SETTINGS_MODULE: sample.settings
        DB_NAME: postgres
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: postgres
      run: |
        cd __testproject
        pip install coverage
        coverage run ./manage.py test --no-input requestlog.tests
        coverage report
        coverage xml -o ../cov.xml
    - name: SonarQube Cloud Scan
      # GitHub doesn't pass secrets to workflows run for pull requests from forks
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    - name: mypy
      run: |
        pip install django-stubs celery-stubs
        mypy src/requestlog
